[project]
name = "syora-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1", "alembic>=1.14,<2", "pydantic-settings>=2.7,<3",
  "pydantic[email]>=2.10,<3", "PyJWT>=2.10,<3", "argon2-cffi>=23.1,<24",
  "python-socketio>=5.12,<6", "boto3>=1.36,<2", "python-multipart>=0.0.20,<1"
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.uvicorn]
factory = false

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
